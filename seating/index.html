<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>მაგიდები · Seating — Sandro &amp; Kopi</title>
<meta name="description" content="იპოვე შენი მაგიდა · Find your table">
<meta name="theme-color" content="#E1EFEE">
<meta property="og:title" content="იპოვე შენი მაგიდა · Find your table">
<meta property="og:description" content="Sandro &amp; Kopi · 15.09.2026 · Syros">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wedding.khasia.ge/seating">
<meta property="og:image" content="https://wedding.khasia.ge/og-image.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500&family=Noto+Serif+Georgian:wght@500;600&family=Noto+Sans+Georgian:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E1EFEE; --bg-2:#CCE6E6; --paper:#FFFFFF;
  --ink:#0A4682; --sea:#075BB4; --sea-light:#6FCAD6; --sea-pale:#C6E7EC;
  --gold:#FF7653; --pink:#EC8CBC; --green:#2E9E5B; --line:#BCDBDC;
  --serif:'Cormorant Garamond','Noto Serif Georgian',Georgia,serif;
  --sans:'Jost','Noto Sans Georgian',system-ui,-apple-system,sans-serif;

  /* themeable board surface */
  --board:var(--bg); --txt:var(--ink); --muted:rgba(10,70,130,.62);
  --card:var(--paper); --card-line:var(--line); --card-shadow:0 2px 10px rgba(10,70,130,.05);
  --badge-bg:var(--sea-pale); --badge-ink:var(--sea);
  --card-radius:20px; --row-line:transparent;
}

/* ===== board look ===== */
body{
  --card-radius:24px; --card-line:transparent;
  --card-shadow:0 5px 0 rgba(10,70,130,.10);
  --badge-bg:rgba(255,255,255,.72); --badge-ink:var(--ink);
}
.card:nth-child(5n+1){--card:#DCEFF1}
.card:nth-child(5n+2){--card:#FFE6DC}
.card:nth-child(5n+3){--card:#FBE2EF}
.card:nth-child(5n+4){--card:#E6F1DA}
.card:nth-child(5n+5){--card:#E6E6F6}
/* tables 2 and 7 are the odd sizes — flagged with their own warm ground */
#t2,#t7{--card:#FBF3D2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--board); color:var(--txt);
  font-family:var(--sans); font-weight:400; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 64px}

/* ---------- top bar ---------- */
.topbar{
  background:#3B82F6; color:var(--gold);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
}
.topbar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar a{color:var(--gold);text-decoration:none;font-size:14px;letter-spacing:.04em;font-weight:500}
.topbar span{color:#fff;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}

/* ---------- header ---------- */
header{text-align:center;padding:34px 0 22px}
header h1{
  font-family:var(--serif); font-weight:600;
  font-size:clamp(28px,8vw,42px); line-height:1.1; margin:0 0 6px;
}
header .sub{font-size:14px;letter-spacing:.06em;color:var(--muted);margin:0}
.pop{font-size:.72em;vertical-align:.12em}
header .date{
  margin-top:14px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);font-weight:500;
}

/* ---------- search ---------- */
.search{position:sticky;top:0;z-index:20;padding:10px 0 12px;background:var(--board)}
.search::after{content:'';position:absolute;left:0;right:0;bottom:-18px;height:18px;
  background:linear-gradient(var(--board),transparent);pointer-events:none}
.search-box{position:relative}
.search-box svg{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;stroke:var(--sea);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.6;pointer-events:none
}
#q{
  width:100%;padding:16px 46px 16px 46px;border-radius:999px;
  border:1.5px solid var(--card-line);background:var(--card);color:var(--txt);
  font-family:var(--sans);font-size:17px;outline:none;
  box-shadow:0 4px 16px rgba(10,70,130,.06);
  transition:border-color .18s,box-shadow .18s;
}
#q::placeholder{color:#7FA8C4}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
#q:focus{border-color:var(--gold);box-shadow:0 4px 20px rgba(255,118,83,.18)}
#clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border:0;border-radius:50%;background:transparent;
  color:var(--sea);font-size:20px;line-height:1;cursor:pointer;display:none
}
#clear.on{display:block}

/* ---------- results ---------- */
#results{margin-top:10px}
.res{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--card-line);border-radius:16px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);
  color:var(--txt);box-shadow:var(--card-shadow);transition:transform .12s,border-color .18s;
}
.res:active{transform:scale(.985)}
.res .num{
  flex:0 0 46px;height:46px;border-radius:50%;
  background:var(--gold);color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-size:22px;font-weight:600;
}
.res .nm{font-size:17px;font-weight:500;line-height:1.25}
.res .tl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-top:2px}
.res .go{margin-left:auto;opacity:.4;font-size:18px}
.empty{
  text-align:center;padding:22px 12px;font-size:15px;opacity:.7;
  background:var(--card);border:1.5px dashed var(--card-line);border-radius:16px;
}
.empty b{display:block;font-weight:500;opacity:1;margin-bottom:4px}
.dupe{font-size:12.5px;line-height:1.45;opacity:.65;text-align:center;margin:2px 4px 10px}

/* ---------- tables ---------- */
.hint{
  text-align:center;font-size:13px;letter-spacing:.04em;color:var(--muted);
  margin:26px 0 18px;
}
.grid{display:grid;gap:14px}
.card{
  background:var(--card);border:1.5px solid var(--card-line);border-radius:var(--card-radius);
  box-shadow:var(--card-shadow);padding:18px 18px 14px;scroll-margin-top:96px;
  transition:border-color .3s,box-shadow .3s,transform .3s;
}
.card.hit{
  border-color:var(--gold);box-shadow:0 8px 28px rgba(255,118,83,.22);
}
.card h2{
  margin:0 0 12px;display:flex;align-items:center;gap:12px;
  font-family:var(--serif);font-weight:600;font-size:28px;
}
.card h2 .badge{
  flex:0 0 42px;height:42px;border-radius:50%;
  background:var(--badge-bg);color:var(--badge-ink);display:grid;place-items:center;
  font-size:20px;transition:background .3s,color .3s;
}
.card.hit h2 .badge{background:var(--gold);color:#fff}
.card h2 .en{
  font-family:var(--sans);font-size:13px;font-weight:400;
  letter-spacing:.06em;color:var(--muted);align-self:center;margin-left:-4px;
}
.card h2 .cnt{
  margin-left:auto;font-family:var(--sans);font-size:11px;font-weight:400;
  letter-spacing:.1em;text-transform:uppercase;opacity:.5;
}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
@media (max-width:339px){ul{grid-template-columns:1fr}}
li{
  font-size:16px;padding:7px 8px;border-radius:8px;border-bottom:1px solid var(--row-line);
  transition:background .3s,color .3s;
}
li.mark{background:#FFE9E2;color:#C4441F;font-weight:500}

footer{text-align:center;margin-top:40px;font-size:14px}
footer a{color:var(--sea);text-decoration:none;border-bottom:1px solid var(--sea-pale);padding-bottom:2px}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <a href="/details/">&larr; განრიგი</a>
  <span></span>
</div></div>

<div class="wrap">

<header>
  <h1>იპოვე შენი მაგიდა <span class="pop">🎉</span></h1>
  <p class="sub">Find your table</p>
  <p class="date">Sandro &amp; Kopi · Syros</p>
</header>

<div class="search">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" enterkeyhint="search"
           placeholder="სახელი · your name">
    <button id="clear" type="button" aria-label="გასუფთავება">&times;</button>
  </div>
  <div id="results" role="status" aria-live="polite"></div>
</div>

<p class="hint">ან იპოვე სიაში · or browse the tables below</p>

<div class="grid" id="grid"></div>

<footer><a href="/">&larr; მოწვევაზე დაბრუნება</a></footer>

</div>

<script>
const TABLES = [{"table":2,"guests":["დაკო","ნოდო","კერვალა","თოთი","გიო","ლიკუ","ნინი"]},{"table":3,"guests":["კრუ","რუსო","გიო","ნინი","გვადი","თიკო","დათა","Elena"]},{"table":4,"guests":["თიკუჩი","დიმიტრი","ზუკი","ნათია","გუკა","თეო","კახა","ირინა"]},{"table":5,"guests":["კობა","ცირა","სამგლე","ელო","ბაია","ტოკლიკა","ლიდია","დგებო"]},{"table":6,"guests":["თიკა","ლევანი","მარჯო","გერო","ლიპუ","კოკა","ლაშა","ანო"]},{"table":7,"guests":["გუკლი","ნინო","ანუნა","წურწუ","ხუნჯუ","ეკუნა","სოფო","კაკავა","ნინი"]},{"table":8,"guests":["ჩიქავა","ნინუ","თემო","ქეთი","ვიკა","მეგი","მიშკა","სალომე"]},{"table":9,"guests":["Felipe","Zulma","Dustin","მერიკო","Nick","მედეა","წულა","ოთო"]},{"table":10,"guests":["ვაკო","ღუბი","სოფუნა","თაკო","კარლო","მარუსკი","თამუნა","Dimitris"]},{"table":11,"guests":["ქეთო","თამუნა","რუსიკო","გია","მაკა","ბაჩუ","ლელა","ელა"]}];

/* ---- Georgian → latin transliteration, then a loose key both sides ---- */
const GE = {'ა':'a','ბ':'b','გ':'g','დ':'d','ე':'e','ვ':'v','ზ':'z','თ':'t','ი':'i','კ':'k',
'ლ':'l','მ':'m','ნ':'n','ო':'o','პ':'p','ჟ':'zh','რ':'r','ს':'s','ტ':'t','უ':'u','ფ':'p',
'ქ':'k','ღ':'gh','ყ':'q','შ':'sh','ჩ':'ch','ც':'ts','ძ':'dz','წ':'ts','ჭ':'ch','ხ':'kh',
'ჯ':'j','ჰ':'h'};
function toLat(s){let o='';for(const ch of s)o += (GE[ch]!==undefined?GE[ch]:ch);return o;}
/* collapse near-homophones so "kheto/qeto/keto" all land on the same key */
function loose(s){
  return s.toLowerCase()
    .replace(/[^a-zა-ჰ\s]/g,'')
    .replace(/kh|gh|zh|dz|ph|th/g,m=>({kh:'k',gh:'g',zh:'j',dz:'z',ph:'p',th:'t'}[m]))
    .replace(/sh/g,'s').replace(/ch|tch/g,'c').replace(/ts/g,'c')
    .replace(/q/g,'k').replace(/w/g,'v').replace(/y/g,'i').replace(/x/g,'k')
    .replace(/\s+/g,'');
}
const INDEX = [];
TABLES.forEach(t => t.guests.forEach((name, i) => {
  INDEX.push({name, table:t.table, id:'g'+t.table+'-'+i, keys:[loose(name), loose(toLat(name))]});
}));

const grid = document.getElementById('grid');
grid.innerHTML = TABLES.map(t => `
  <section class="card" id="t${t.table}">
    <h2><span class="badge">${t.table}</span> მაგიდა <span class="en">Table</span>
        <span class="cnt">${t.guests.length} სტუმარი</span></h2>
    <ul>${t.guests.map((n,i)=>`<li id="g${t.table}-${i}">${n}</li>`).join('')}</ul>
  </section>`).join('');

const q = document.getElementById('q');
const clearBtn = document.getElementById('clear');
const results = document.getElementById('results');
let lastMarked = [];

function clearMarks(){
  lastMarked.forEach(el=>el.classList.remove('mark','hit'));
  lastMarked = [];
}
function search(){
  const raw = q.value.trim();
  clearBtn.classList.toggle('on', raw.length>0);
  if(!raw){ results.innerHTML=''; clearMarks(); return; }
  const k = loose(raw);
  if(!k){ results.innerHTML=''; return; }
  const starts = INDEX.filter(g=>g.keys.some(x=>x.startsWith(k)));
  const inside = INDEX.filter(g=>!starts.includes(g) && g.keys.some(x=>x.includes(k)));
  const hits = starts.concat(inside).slice(0,12);

  if(!hits.length){
    results.innerHTML = `<div class="empty"><b>ვერ ვიპოვეთ</b>
      სცადე სხვანაირად, ან ჰკითხე ჩვენს — we'll find you.</div>`;
    clearMarks(); return;
  }
  const names = hits.map(h=>h.name);
  const dupe = names.some((n,i)=>names.indexOf(n)!==i);
  results.innerHTML = (dupe?`<p class="dupe">ერთი და იგივე სახელი რამდენიმე მაგიდაზეა — აირჩიე შენი · same name on more than one table</p>`:'') + hits.map(h=>`
    <button class="res" data-id="${h.id}" data-t="${h.table}">
      <span class="num">${h.table}</span>
      <span><span class="nm">${h.name}</span><br><span class="tl">მაგიდა · table ${h.table}</span></span>
      <span class="go">&rsaquo;</span>
    </button>`).join('');
}
results.addEventListener('click', e=>{
  const btn = e.target.closest('.res'); if(!btn) return;
  clearMarks();
  const li = document.getElementById(btn.dataset.id);
  const card = document.getElementById('t'+btn.dataset.t);
  if(li){ li.classList.add('mark'); lastMarked.push(li); }
  if(card){
    card.classList.add('hit'); lastMarked.push(card);
    const bar = document.querySelector('.search');
    const off = (bar ? bar.getBoundingClientRect().height : 0) + 14;
    const y = card.getBoundingClientRect().top + window.pageYOffset - off;
    window.scrollTo({top: Math.max(0, y), behavior:'smooth'});
  }
  q.blur();
});
q.addEventListener('input', search);
clearBtn.addEventListener('click', ()=>{ q.value=''; search(); q.focus(); });
</script>
</body>
</html>
